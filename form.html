<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generador de Entradas</title>
  <link rel="stylesheet" href="form.css" />
</head>
<body>
<header>
  <h1 id="formTitle">Cargando formulario...</h1>
</header>
<main class="center">
  <div id="errorMsg"></div>

  <!-- Formulario de registro -->
  <form id="formData">
    <label for="nombre">Nombre y Apellido:
      <input type="text" id="nombre" required autocomplete="off" placeholder="Ej: Juan Pérez" />
    </label>

    <label for="cedula">Cédula (8 dígitos):
      <input type="text" id="cedula" required maxlength="8" autocomplete="off" placeholder="Ej: 30123456" />
    </label>

    <label for="edad">Edad:
      <input type="number" id="edad" required min="0" autocomplete="off" placeholder="Ej: 20" />
    </label>

    <!-- Contenedor dinámico para parámetros personalizados -->
    <div id="customFieldsContainer"></div>

    <label for="referencia">Código de Referencia:
      <input type="text" id="referencia" required autocomplete="off" placeholder="Código de referencia" />
    </label>

    <button type="submit" id="btnSiguiente">Siguiente</button>
  </form>

  <!-- Sección de confirmación de datos -->
  <div id="confirmacionDatos" style="display:none;">
    <h3>Confirma tus datos</h3>
    <div class="datos">
      <div><b>Nombre:</b> <span id="confNombre"></span></div>
      <div><b>Cédula:</b> <span id="confCedula"></span></div>
      <div><b>Edad:</b> <span id="confEdad"></span></div>
      <!-- Contenedor de confirmación para parámetros personalizados -->
      <div id="confCustomFieldsContainer"></div>
      <div><b>Referencia:</b> <span id="confReferencia"></span></div>
    </div>
    <p style="color: #d9534f; font-weight: bold; text-align: center; margin-top: 15px; font-size: 0.95rem;">¿Son correctos tus datos? Una vez confirmados no se podrán cambiar.</p>
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
      <button type="button" id="btnConfirmar" style="background: #28a745; width: 45%;">Sí</button>
      <button type="button" id="btnCorregir" style="background: #dc3545; width: 45%;">No, corregir</button>
    </div>
  </div>

  <!-- Sección de entrada generada (Ticket) -->
  <div id="entradaGenerada" style="display:none;">
    <h3>Su entrada ha sido generada</h3>
    <div class="ticket-img-wrap">
      <img id="ticketBg" src="" alt="Fondo de Entrada" class="ticket-bg" />
      <div class="qr-absolute">
        <canvas id="qrCanvas"></canvas>
        <div id="codigoQR" class="qr-code-label">000</div>
      </div>
    </div>
    <div class="datos" style="background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee;">
      <div><b>Nombre:</b> <span id="outNombre"></span></div>
      <div><b>Cédula:</b> <span id="outCedula"></span></div>
      <div><b>Edad:</b> <span id="outEdad"></span></div>
      <!-- Contenedor de ticket para parámetros personalizados -->
      <div id="outCustomFieldsContainer"></div>
      <div><b>Código:</b> <span id="outCodigo"></span></div>
      <div id="outReferenciaContenedor"><b>Referencia:</b> <span id="outReferencia"></span></div>
    </div>
    <button id="guardarBtn">Guardar entrada</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
<script type="module" src="form.js"></script>
</body>
</html>
